name: medicare_app
description: "MediCare - Medicine Reminder and Delivery System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # ── Maps & Location ───────────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Local Storage ─────────────────────────────────────────
  hive_flutter: ^1.1.0

  # ── Notifications ─────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Image / Camera ────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Permissions ───────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.0
  http: ^1.2.2

  # ── UI ────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/badges/
    - assets/translations/
